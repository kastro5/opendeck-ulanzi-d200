# Build the plugin for Windows and Linux and publish a release when a version tag is pushed.
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# The tag must match the Version in manifest.json, and CHANGELOG.md must have a
# "## 1.2.3" entry; it becomes the release notes. Run the workflow by hand
# (Actions -> Release -> Run workflow) for a test build: the zips are uploaded
# as an artifact and nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: d200x_plugin.exe
          # The oldest glibc on offer, so the binary also runs on older distros.
          - os: ubuntu-22.04
            name: d200x_plugin-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build
        # One file, console subsystem on purpose: OpenDeck starts plugins with
        # CREATE_NO_WINDOW and sends stderr to its plugin log. On Linux the
        # wheel's `hidraw` module must come along (the plugin prefers it there).
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --log-level WARN
          --name "${{ matrix.name }}" --hidden-import hidraw
          --distpath dist --workpath build --specpath build
          dev.kastro5.ulanzi-d200.sdPlugin/d200x_plugin.py

      - name: Smoke test
        # With nothing listening on the port, the plugin must get as far as the
        # websocket connect -- proof every bundled import loaded.
        shell: bash
        run: |
          set +e
          "./dist/${{ matrix.name }}" -port 1 -pluginUUID ci 2> smoke.log
          cat smoke.log
          grep -qi "refused" smoke.log || { echo "plugin did not reach the websocket"; exit 1; }
          ! grep -q "Missing Python packages" smoke.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.os }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Package
        run: |
          args="--exe dist/d200x_plugin.exe --linux-bin dist/d200x_plugin-linux"
          if [ "$GITHUB_REF_TYPE" = tag ]; then args="$args --version $GITHUB_REF_NAME"; fi
          python3 scripts/package_release.py $args
          unzip -Zl release/*d200x*.zip | grep -E "d200x_plugin-linux|launch.sh"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*.zip
          --title "$GITHUB_REF_NAME"
          --notes-file release/notes.md
          --verify-tag
